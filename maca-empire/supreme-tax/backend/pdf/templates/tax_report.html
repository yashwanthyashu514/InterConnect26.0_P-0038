<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ title }} — Supreme Tax</title>
  <style>
    @page {
      size: A4;
      margin: 2cm;
      @bottom-right {
        content: "Page " counter(page) " of " counter(pages);
        font-size: 10px;
        color: #9CA3AF;
      }
    }
    body {
      font-family: 'Noto Sans', 'Arial', sans-serif;
      color: #1a1a2e;
      font-size: 13px;
      line-height: 1.7;
      margin: 0;
      padding: 0;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 2px solid #C9A84C;
    }
    .brand { font-size: 22px; font-weight: 800; color: #0A0F1E; letter-spacing: -1px; }
    .brand span { color: #C9A84C; }
    .meta { text-align: right; font-size: 11px; color: #6B7280; }
    .meta strong { color: #1a1a2e; display: block; font-size: 13px; }
    .confidential {
      display: inline-block;
      background: #FEF3C7;
      color: #92400E;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }
    h1 { color: #C9A84C; border-bottom: 1px solid #C9A84C; padding-bottom: 8px; font-size: 20px; margin-top: 0; }
    h2 { color: #0A0F1E; font-size: 15px; margin-top: 28px; padding-bottom: 4px; border-bottom: 1px solid #E5E7EB; }
    h3 { color: #374151; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 12px; }
    th { background: #0A0F1E; color: #ffffff; padding: 9px 12px; text-align: left; font-weight: 600; }
    td { padding: 9px 12px; border-bottom: 1px solid #E5E7EB; }
    tr:nth-child(even) td { background: #F9FAFB; }
    .highlight { background: #FFFBEB; border-left: 3px solid #C9A84C; padding: 12px 16px; margin: 16px 0; border-radius: 0 8px 8px 0; }
    .footer {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid #E5E7EB;
      font-size: 10px;
      color: #9CA3AF;
      line-height: 1.5;
    }
    .content { white-space: pre-wrap; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="brand">Supreme<span>Tax</span></div>
      <div style="font-size:11px; color:#6B7280; margin-top:4px;">{{ agent_name }}</div>
    </div>
    <div class="meta">
      <strong>Confidential Advisory Report</strong>
      Prepared for: {{ user_name }}<br/>
      Date: {{ generated_date }}
    </div>
  </div>

  <div class="confidential">⚠ CONFIDENTIAL</div>

  <h1>{{ title }}</h1>

  <div class="content">{{ content }}</div>

  <div class="footer">
    {{ disclaimer }}<br/>
    Generated by Supreme Tax on {{ generated_date }}. For queries, contact your Supreme Tax advisor.
  </div>

</body>
</html>
